# Homelab: una sola imagen, dos procesos.
#
# El bloque &comun no es cosmetica. Ambos servicios son EXACTAMENTE la misma
# imagen con distinto comando; escribir el build dos veces garantiza que algun
# dia divergen sin que nadie lo note y acabas con dos builds distintos
# corriendo juntos. Con el ancla, es imposible por construccion.
name: taller-voz

x-comun: &comun
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      VOZ_LOCAL: "true"
      # Viene de la shell:
      #   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose ... build
      GIT_COMMIT: ${GIT_COMMIT:-desconocido}
  image: taller-voz:local
  restart: unless-stopped

services:
  mcp:
    <<: *comun
    environment:
      # El codigo escucha en 127.0.0.1 por defecto (ADR de Fase 1). Dentro de
      # un contenedor eso lo haria inalcanzable: aqui se abre a proposito.
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      # Este servicio es el dueno de los datos, y solo el siembra.
      SEMBRAR_BD: "true"
    volumes:
      - datos:/app/mcp_server/db
    ports:
      # Atado a loopback: al exterior se expondra por el tunel de Cloudflare,
      # nunca abriendo un puerto del router.
      - "127.0.0.1:8010:8000"

  api:
    <<: *comun
    # Mismo ENTRYPOINT, distinto CMD. Sin SEMBRAR_BD el entrypoint no toca la
    # base: este contenedor ni siquiera monta el volumen. Un contenedor, un
    # proceso, y un solo dueno de los datos.
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      DEPLOY_ENV: local
      VOICE_PROVIDER: local
      # El nombre del servicio, no localhost: dentro de la red de Compose cada
      # contenedor tiene su propio loopback y 127.0.0.1 seria el mismo.
      MCP_SERVER_URL: http://mcp:8000/mcp
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mcp:
        condition: service_healthy
    # La imagen trae una sonda pensada para MCP. Aqui se sustituye por una que
    # de verdad ejecuta la aplicacion: un GET a /salud, no un socket abierto.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/salud', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  datos:
