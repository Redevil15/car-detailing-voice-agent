[project]
name = "car-detailing-voice-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "mcp[cli]>=2.1.1",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "core", "mcp_server", "observability", "voice"]
