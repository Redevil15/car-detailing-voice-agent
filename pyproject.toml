[project]
name = "car-detailing-voice-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "mcp>=2.1.1",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "core", "mcp_server", "observability", "voice"]

[dependency-groups]
dev = [
    "mcp[cli]>=2.1.1",
    "sounddevice>=0.5.6",
]
voz-local = [
    "faster-whisper>=1.2.1",
    "piper-tts>=1.8.0",
]

[tool.uv]
# Los grupos se instalan con un "uv sync" a secas en la Mac y el homelab.
# La imagen de AWS los excluye con: uv sync --no-group voz-local
default-groups = ["dev", "voz-local"]
